name: AegisPass HCE Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  analyze-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Run Unit Tests & Verification Suite
        run: ./gradlew testDebugUnitTest

      - name: Run Android Lint Static Analysis
        run: ./gradlew lintRelease

      - name: Assemble Minified Release APK
        run: ./gradlew assembleRelease

      - name: Verify APK Size Target (< 4.5 MB) & Generate SHA-256 Checksum
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            SIZE_BYTES=$(stat -c%s "$APK_PATH")
            MAX_BYTES=$((4500 * 1024))
            echo "Release APK size: ${SIZE_BYTES} bytes"
            if [ "$SIZE_BYTES" -gt "$MAX_BYTES" ]; then
              echo "::warning::APK exceeds 4.5 MB baseline target!"
            fi
            sha256sum "$APK_PATH" > "${APK_PATH}.sha256"
          fi
